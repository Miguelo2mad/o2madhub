<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leads — O2MAD HUB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/leads-shared.js"></script>
</head>
<body>

<header>
  <div class="logo">O2MAD <span>HUB</span></div>
  <span style="font-size:13px;color:var(--text-muted);">Leads · Agencia</span>
  <div class="spacer"></div>
  <span class="user-email" id="userEmail"></span>
  <button onclick="window.location.href='/'">← Hub</button>
  <button onclick="signOut()">Salir</button>
</header>

<div class="controls">
  <select id="irCliente" onchange="if (this.value) location.href = panelCliente(this.value)">
    <option value="">Panel de cliente…</option>
  </select>
  <div class="seg" id="atajos">
    <button data-atajo="hoy">Hoy</button>
    <button data-atajo="7d">7 días</button>
    <button data-atajo="mes">Mes actual</button>
    <button data-atajo="mesant">Mes anterior</button>
    <button data-atajo="12m">12 meses</button>
  </div>
  <input type="date" id="desde" />
  <span style="color:var(--text-muted);">→</span>
  <input type="date" id="hasta" />
  <div class="spacer"></div>
  <a class="btn admin-only hidden" href="/leads/clientes">Subcuentas</a>
  <button class="btn accent admin-only hidden" id="btnSync" onclick="lanzarSync({ alTerminar: recargarTodo })">
    <span id="syncLabel">Sincronizar ahora</span>
  </button>
</div>

<main>
  <div id="syncResult" class="sync-box hidden"></div>

  <div class="kpi-grid" id="kpis"></div>

  <div class="chart-box">
    <div class="chart-head">
      <h3>Evolución por canal · todos los clientes</h3>
      <div class="seg" id="granularidad">
        <button data-g="dia" class="on">Día</button>
        <button data-g="semana">Semana</button>
        <button data-g="mes">Mes</button>
      </div>
    </div>
    <svg id="chart" viewBox="0 0 800 220" preserveAspectRatio="xMidYMid meet" style="height:220px;"></svg>
    <div class="chart-legend" id="legend"></div>
  </div>

  <div id="anual"></div>

  <div class="table-box">
    <h3>Ranking de clientes · <span id="rankingRango" style="color:var(--text-muted);font-weight:400;"></span></h3>
    <div class="table-scroll">
      <table>
        <thead><tr><th>#</th><th class="left">Cliente</th><th class="left" style="width:40%;"></th><th>Leads</th><th>Periodo anterior</th><th>Variación</th></tr></thead>
        <tbody id="tbodyRanking"><tr><td colspan="6" class="empty">Cargando…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="table-box">
    <h3>Leads por cliente · últimos 12 meses</h3>
    <div class="table-scroll">
      <table>
        <thead id="theadMatriz"></thead>
        <tbody id="tbodyMatriz"><tr><td class="empty">Cargando…</td></tr></tbody>
      </table>
    </div>
  </div>

  <details id="detallesLog">
    <summary>Últimas sincronizaciones</summary>
    <div class="details-body">
      <div class="table-box" style="margin-bottom:0;">
        <div class="table-scroll">
          <table>
            <thead><tr><th class="left">Subcuenta</th><th class="left">Inicio</th><th>Duración</th><th>Nuevos</th><th>Actualizados</th><th class="left">Error</th></tr></thead>
            <tbody id="tbodyLog"><tr><td colspan="6" class="empty">—</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </details>
</main>

<script>
  let nombres = {};
  const panelCliente = loc => `/leads/cliente?location_id=${encodeURIComponent(loc)}`;

  (async () => {
    document.getElementById('kpis').innerHTML = KPIS_HTML;
    document.getElementById('anual').innerHTML = ANUAL_HTML;
    leyendaCanales('legend');
    if (!await iniciarSesion()) return;
    montarPeriodo({ onPeriodo: recargarPeriodo, onGranularidad: cargarSerie });
    document.getElementById('detallesLog').addEventListener('toggle', e => { if (e.target.open) cargarLog(); });
    try {
      const clientes = await api('/api/leads/clientes');
      nombres = Object.fromEntries(clientes.map(c => [c.location_id, c.nombre]));
      // Solo subcuentas en captación: las inactivas no existen para el panel.
      const sel = document.getElementById('irCliente');
      clientes.filter(c => c.activo).forEach(c => sel.insertAdjacentHTML('beforeend',
        `<option value="${esc(c.location_id)}">${esc(c.nombre)}</option>`));
    } catch (e) { console.error('clientes error:', e); }
    recargarTodo();
  })();

  function recargarTodo() {
    cargarResumen();
    cargarAnual();
    cargarMatriz();
    recargarPeriodo();
    if (document.getElementById('detallesLog').open) cargarLog();
  }
  function recargarPeriodo() { cargarSerie(); cargarRanking(); }

  async function cargarResumen() {
    try { renderKpis(await api('/api/leads/resumen')); } catch (e) { console.error('resumen error:', e); }
  }

  async function cargarAnual() {
    try { renderAnual(await api('/api/leads/anual')); } catch (e) { console.error('anual error:', e); }
  }

  async function cargarSerie() {
    try {
      const r = await api(`/api/leads/serie?${qs({ ...rangoActual(), granularidad: periodo.granularidad })}`);
      renderBarrasCanal('chart', r.serie, r.granularidad);
    } catch (e) { svgVacio(document.getElementById('chart'), e.message); }
  }

  async function cargarRanking() {
    const tbody = document.getElementById('tbodyRanking');
    try {
      const r = await api(`/api/leads/ranking?${qs(rangoActual())}`);
      document.getElementById('rankingRango').textContent =
        `${fmtDia(r.desde)} – ${fmtDia(r.hasta)} vs ${fmtDia(r.anterior.desde)} – ${fmtDia(r.anterior.hasta)}`;
      const max = Math.max(...r.ranking.map(c => c.leads), 1);
      tbody.innerHTML = r.ranking.length ? r.ranking.map((c, i) => `
        <tr class="link" onclick="location.href='${panelCliente(c.location_id)}'">
          <td style="color:var(--text-muted);">${i + 1}</td>
          <td class="left" style="color:var(--arena);max-width:280px;overflow:hidden;text-overflow:ellipsis;">${esc(c.nombre)}</td>
          <td class="left"><span class="bar-inline" style="width:${Math.round((c.leads / max) * 100)}%;"></span></td>
          <td style="font-weight:600;">${fmtInt(c.leads)}</td>
          <td style="color:var(--text-muted);">${fmtInt(c.leads_anterior)}</td>
          <td>${varHtml(c.variacion_pct)}</td>
        </tr>`).join('') : '<tr><td colspan="6" class="empty">Ninguna subcuenta en captación con token configurado</td></tr>';
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">${esc(e.message)}</td></tr>`;
    }
  }

  async function cargarMatriz() {
    try {
      const r = await api('/api/leads/matriz');
      const mesActual = hoyISO().slice(0, 7);
      document.getElementById('theadMatriz').innerHTML = `<tr><th>Cliente</th>${r.meses.map(m =>
        `<th title="${m === mesActual ? 'Mes en curso' : ''}">${fmtMes(m)}${m === mesActual ? '*' : ''}</th>`).join('')}<th>Total</th></tr>`;
      const tbody = document.getElementById('tbodyMatriz');
      if (!r.clientes.length) {
        tbody.innerHTML = `<tr><td colspan="${r.meses.length + 2}" class="empty">Ninguna subcuenta en captación con token configurado</td></tr>`;
        return;
      }
      const celda = (vals, i) => {
        const v = vals[r.meses[i]];
        if (i === 0) return `<td>${fmtInt(v)}</td>`;
        const prev = vals[r.meses[i - 1]];
        const t = v > prev ? '<span class="trend up">▲</span>' : v < prev ? '<span class="trend down">▼</span>' : '';
        return `<td>${fmtInt(v)}${t}</td>`;
      };
      tbody.innerHTML = r.clientes.map(c => `
        <tr class="link" onclick="location.href='${panelCliente(c.location_id)}'">
          <td title="${esc(c.nombre)}">${esc(c.nombre)}</td>
          ${r.meses.map((_, i) => celda(c.meses, i)).join('')}
          <td style="font-weight:600;">${fmtInt(c.total)}</td>
        </tr>`).join('') + `
        <tr class="totales">
          <td>Total</td>
          ${r.meses.map((_, i) => celda(r.totales, i)).join('')}
          <td>${fmtInt(Object.values(r.totales).reduce((a, b) => a + b, 0))}</td>
        </tr>`;
    } catch (e) {
      document.getElementById('tbodyMatriz').innerHTML = `<tr><td class="empty">${esc(e.message)}</td></tr>`;
    }
  }

  async function cargarLog() {
    const tbody = document.getElementById('tbodyLog');
    try {
      const log = await api('/api/leads/sync-log?limite=50');
      tbody.innerHTML = log.length ? log.map(l => `<tr>
          <td>${esc(nombres[l.location_id] || l.location_id || '—')}</td>
          <td class="left">${fmtFechaHora(l.inicio)}</td>
          <td>${l.fin ? Math.round((new Date(l.fin) - new Date(l.inicio)) / 1000) + ' s' : '—'}</td>
          <td>${fmtInt(l.leads_nuevos)}</td>
          <td>${fmtInt(l.leads_actualizados)}</td>
          <td class="left ${l.error ? 'down' : ''}" style="white-space:normal;">${esc(l.error || '')}</td>
        </tr>`).join('') : '<tr><td colspan="6" class="empty">Aún no hay sincronizaciones</td></tr>';
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">${esc(e.message)}</td></tr>`;
    }
  }
</script>
</body>
</html>
